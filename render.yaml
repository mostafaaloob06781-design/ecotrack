services:
  - type: web
    name: ecotrack
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ENV
        value: prod
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "1"
