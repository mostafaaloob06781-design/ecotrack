{% extends "base.html" %}
{% block title %}دخول{% endblock %}
{% block content %}
<section class="narrow">
  <h1>تسجيل الدخول</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf(request) }}">
    <label>الإيميل <input type="email" name="email" required autocomplete="email"></label>
    <label>كلمة المرور <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">دخول</button>
  </form>
  <p class="muted">معندكش حساب؟ <a href="/register">سجّل دلوقتي</a></p>
</section>
{% endblock %}
